services:
  - type: web
    name: isuv-synthetic-demo
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm build
    startCommand: pnpm db:migrate && pnpm db:seed && pnpm --filter @isuv/api start
    healthCheckPath: /health/live
    envVars:
      - key: NODE_VERSION
        value: 24.14.1
      - key: NODE_ENV
        value: production
      - key: API_HOST
        value: 0.0.0.0
      - key: ISUV_SERVE_WEB
        value: true
      - key: ISUV_PUBLIC_DEMO
        value: true
      - key: ISUV_PUBLIC_DEMO_USER_ID
        value: a3000000-0000-4000-8000-000000000008
      - key: DATABASE_URL
        fromDatabase:
          name: isuv-synthetic-demo-db
          property: connectionString

databases:
  - name: isuv-synthetic-demo-db
    plan: free
    region: frankfurt
    postgresMajorVersion: '17'
    databaseName: isuv
    user: isuv_app
    ipAllowList: []
