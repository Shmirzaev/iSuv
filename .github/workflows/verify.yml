name: verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_DB: isuv
          POSTGRES_USER: isuv_app
          POSTGRES_PASSWORD: local-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U isuv_app -d isuv"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgres://isuv_app:local-ci-only@localhost:5432/isuv
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Audit high-severity dependency advisories
        run: pnpm audit --audit-level high
      - name: Install Chromium for browser smoke tests
        run: pnpm --filter @isuv/web exec playwright install --with-deps chromium
      - run: pnpm verify
      - name: Verify repeatable database setup
        run: pnpm db:migrate && pnpm db:migrate && pnpm db:seed && pnpm db:seed
      - name: Verify portable local backup and isolated restore
        run: |
          cp .env.example .env
          sed -i 's/^POSTGRES_PORT=.*/POSTGRES_PORT=55432/' .env
          sed -i 's|^DATABASE_URL=.*|DATABASE_URL=postgres://isuv_app:change-me-local-only@localhost:55432/isuv|' .env
          export DATABASE_URL=postgres://isuv_app:change-me-local-only@localhost:55432/isuv
          docker compose --env-file .env up -d postgres
          pnpm db:migrate
          pnpm db:seed
          pwsh -NoProfile -File scripts/backup-restore-smoke.ps1 -Cleanup
      - name: Run database authorization integration tests
        run: corepack pnpm --filter @isuv/api test:db
      - name: Run browser smoke tests
        run: pnpm test:e2e
